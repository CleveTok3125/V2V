<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>V2V — Kiểm tra Trip</title>
  <style>
    :root {
      --bg: #101014;
      --panel: #1a1a21;
      --panel2: #121218;
      --text: #e6ecf5;
      --muted: #8b93a5;
      --accent: #4f7dff;
      --error: #ff6b6b;
      --ok: #7ddf9a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
    .pill {
      display: inline-block;
      font-weight: 700;
      border-radius: 999px;
      padding: 6px 14px;
      margin: 0 0 16px;
    }
    .pill.ok { background: rgba(125, 223, 154, 0.14); color: var(--ok); }
    .pill.bad { background: rgba(255, 107, 107, 0.14); color: var(--error); }
    .pill.wait { background: rgba(79, 125, 255, 0.12); color: var(--accent); }
    section {
      background: var(--panel);
      border: 1px solid #262633;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 0 0 12px;
    }
    section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
    blockquote {
      margin: 0;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      background: var(--panel2);
      border-radius: 0 8px 8px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .row { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
    .row + .row { border-top: 1px solid #22222e; }
    .row .k { flex: 0 0 108px; color: var(--muted); font-size: 13px; padding-top: 4px; }
    .row .v {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 13px;
      overflow-wrap: anywhere;
      background: var(--panel2);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .row button, .apilink button { flex: 0 0 auto; }
    button {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: rgba(79, 125, 255, 0.12); }
    button:disabled { opacity: 0.45; cursor: default; }
    .apilink { display: flex; gap: 8px; }
    .apilink input {
      flex: 1;
      min-width: 0;
      background: var(--panel2);
      border: 1px solid #262633;
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: var(--mono);
      font-size: 12px;
    }
    details { margin-top: 4px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    pre {
      background: var(--panel2);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .note { color: var(--muted); font-size: 12px; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Kiểm tra Trip</h1>
    <p class="sub">Xác thực stateless chữ ký tripcode, không cần đăng nhập.</p>
    <div id="pill" class="pill wait">Đang kiểm tra…</div>

    <section id="quote-sec" class="hidden">
      <h2>Nội dung tin nhắn</h2>
      <blockquote id="quote"></blockquote>
    </section>

    <section>
      <h2>Kết quả</h2>
      <div id="fields"></div>
    </section>

    <section>
      <h2>Link API gốc</h2>
      <div class="apilink">
        <input id="apiurl" readonly />
        <button id="copy-api" type="button">Copy</button>
      </div>
    </section>

    <details>
      <summary>JSON thô (debug)</summary>
      <pre id="rawjson">{}</pre>
    </details>

    <p class="note">Trang này chỉ hiển thị kết quả do server ký xác thực; mọi chữ đều là text thuần, không thực thi.</p>
  </main>
  <script>
    (function () {
      "use strict";
      var pill = document.getElementById("pill");
      var fieldsEl = document.getElementById("fields");
      var quoteSec = document.getElementById("quote-sec");
      var quoteEl = document.getElementById("quote");
      var apiInput = document.getElementById("apiurl");
      var rawEl = document.getElementById("rawjson");

      function setPill(text, cls) {
        pill.textContent = text;
        pill.className = "pill " + cls;
      }

      function copyText(text, btn) {
        function done(ok) {
          if (!btn) return;
          btn.disabled = false;
          btn.textContent = ok ? "Đã copy" : "Lỗi copy";
          setTimeout(function () { btn.textContent = "Copy"; }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
          return;
        }
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          done(ok);
        } catch (e) {
          done(false);
        }
      }

      function addCopy(container, text) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Copy";
        btn.addEventListener("click", function () {
          btn.disabled = true;
          copyText(text, btn);
        });
        container.appendChild(btn);
      }

      // badgeColor from the API is an ANSI SGR string ("38;2;r;g;bm").
      // Anything else falls back to the verdict colors.
      function badgeCss(color, valid) {
        var m = /^38;2;(\d{1,3});(\d{1,3});(\d{1,3})m$/.exec((color || "").trim());
        if (m) {
          var c = [m[1], m[2], m[3]].map(function (v) { return Math.max(0, Math.min(255, +v)); });
          return "rgb(" + c.join(",") + ")";
        }
        return valid ? "#4f7dff" : "#ff6b6b";
      }

      function addField(label, value, copyable) {
        var row = document.createElement("div");
        row.className = "row";
        var k = document.createElement("div");
        k.className = "k";
        k.textContent = label;
        var v = document.createElement("div");
        v.className = "v";
        v.textContent = value;
        row.appendChild(k);
        row.appendChild(v);
        if (copyable !== false) addCopy(row, value);
        fieldsEl.appendChild(row);
        return v;
      }

      function fail(message) {
        setPill(message, "bad");
      }

      apiInput.value = location.href;
      document.getElementById("copy-api").addEventListener("click", function () {
        var btn = this;
        btn.disabled = true;
        copyText(apiInput.value, btn);
      });

      var api = location.pathname + location.search;
      fetch(api, { headers: { "Accept": "application/json" }, cache: "no-store" })
        .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
        .then(function (res) {
          var j = res.body || {};
          rawEl.textContent = JSON.stringify(j, null, 2);
          if (!j.valid) {
            fail("❌ Không hợp lệ" + (j.error ? ": " + j.error : ""));
            if (j.error) addField("lỗi", String(j.error), false);
            return;
          }
          setPill("✅ Trip hợp lệ", "ok");
          var q = new URLSearchParams(location.search);
          var text = q.get("text") || "";
          if (text) {
            quoteSec.classList.remove("hidden");
            quoteEl.textContent = text;
            addCopy(quoteSec, text);
          }
          if (j.badge) {
            var badgeEl = addField("badge", j.badge, true);
            badgeEl.style.color = badgeCss(j.badgeColor, true);
            badgeEl.style.fontWeight = "700";
          }
          if (j.pub) addField("pub", j.pub, true);
          addField("seq", String(j.seq), true);
          if (j.server_pub) addField("server_pub", j.server_pub, true);
          var dn = q.get("display_name") || "";
          if (dn) addField("tên", dn, true);
          var tmp = q.get("tmp_id") || "";
          if (tmp) addField("tmp_id", tmp, true);
          var rp = q.get("reply_to") || "";
          if (rp) addField("reply_to", rp, true);
        })
        .catch(function (e) {
          fail("❌ Không gọi được API: " + (e && e.message ? e.message : e));
        });
    })();
  </script>
</body>
</html>
