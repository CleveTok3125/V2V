# GoReleaser config for V2V.
#
# Scope split: GoReleaser owns the binary matrix, archives, checksums,
# signing and the GitHub release. Docker images are built and pushed by
# GitHub Actions with buildx (see .github/workflows/release.yml); the
# Makefile still owns `dev`, `web` and `check` for local work.
version: 2

project_name: V2V

before:
  hooks:
    # Build the wasm web bundle once. It is platform-independent, so a
    # single build is copied into every server archive below. Hooks are
    # exec'd directly, so wrap the env assignment in `sh -c`.
    - "sh -c 'GIT_HASH={{ .Tag }} make web'"
    # Standalone browser client: the wasm bundle plus serve.py, zipped
    # once. Platform-independent, attached by release.extra_files below
    # (archives require a build id and would emit one copy per platform).
    - >-
      sh -c 'rm -f dist/V2V-webterm-{{ .Version }}.zip &&
      mkdir -p dist/stage/webterm &&
      cp -r webterm/. dist/stage/webterm/ &&
      cp scripts/webterm-serve/serve.py dist/stage/webterm/serve.py &&
      (cd dist/stage/webterm && zip -qr ../../V2V-webterm-{{ .Version }}.zip .)'

builds:
  - id: client
    main: ./client
    binary: V2V-{{ .Os }}-{{ .Arch }}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Distinct per-arch binary names keep the dist root tidy (one file
    # per platform) for the bare-binary assets below.
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Tag }}

  # Android needs the cgo (bionic) resolver: a CGO_ENABLED=0 build uses the
  # pure-Go resolver, which reads /etc/resolv.conf (absent on Android) and
  # then falls back to 127.0.0.1:53, so every lookup fails on Termux. The
  # NDK toolchain is provided by the release workflow (CC_ANDROID).
  - id: client-android
    main: ./client
    binary: V2V-android-aarch64
    goos:
      - android
    goarch:
      - arm64
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.CC_ANDROID }}
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Tag }}

  - id: v2vctl
    main: ./cmd/v2vctl
    binary: >-
      V2Vctl-{{ .Os }}-{{ if and (eq .Os "android") (eq .Arch "arm64") }}aarch64{{ else }}{{ .Arch }}{{ end }}
    goos:
      - windows
      - linux
      - android
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: android
        goarch: amd64
    # Predictable dist path for the bare binary and the staged copy the
    # server archive bundles.
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Tag }}
    hooks:
      # Stage a copy named `v2vctl` (or `v2vctl.exe`) per platform so the
      # server archive can include it under a stable name: archive `dst`
      # fields are not templated, so a conditional rename there does not
      # work.
      post:
        - >-
          sh -c 'mkdir -p "dist/stage/{{ .Os }}_{{ .Arch }}" && cp "{{ .Path }}" "dist/stage/{{ .Os }}_{{ .Arch }}/v2vctl{{ if eq .Os "windows" }}.exe{{ end }}"'

  - id: server
    main: ./server
    binary: server
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    tags:
      - netgo
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.Version={{ .Tag }}

archives:
  # Clients and v2vctl ship as bare binaries, matching the historical
  # `public/V2V-*` asset names.
  - id: client
    ids:
      - client
    formats:
      - binary
    # Bare binary assets keep the historical `V2V-<os>-<arch>` names
    # (no version/OS/arch suffix that the binary default would add).
    name_template: "{{ .Binary }}"
  - id: client-android
    ids:
      - client-android
    formats:
      - binary
    name_template: "{{ .Binary }}"
  - id: v2vctl
    ids:
      - v2vctl
    formats:
      - binary
    name_template: "{{ .Binary }}"

  # One self-contained server bundle per platform: binary, wasm web
  # bundle, bootstrap template, compose file and the matching v2vctl.
  - id: server
    ids:
      - server
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "V2V-server-{{ .Os }}-{{ .Arch }}"
    files:
      - src: webterm/**
      - src: template/**
      - src: v2v-template.json
      - src: docker-compose.yml
      - src: INSTALL.md
      - src: dist/stage/{{ .Os }}_{{ .Arch }}/v2vctl*
        strip_parent: true

checksum:
  name_template: SHA256SUMS

sboms:
  - artifacts: archive

signs:
  # cosign v4 defaults to the new bundle format and ignores
  # --output-signature/--output-certificate, so write a single
  # .sigstore.json bundle (signature + certificate + transparency log).
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: CleveTok3125
    name: V2V
  draft: true
  prerelease: auto
  name_template: "{{ .Tag }}"
  extra_files:
    - glob: dist/V2V-webterm-*.zip
