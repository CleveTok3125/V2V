services:
  V2V:
    build:
      context: .
      # Fallback for any layer that still needs egress: the host's network
      # namespace sidesteps container DNS quirks (e.g. link-local resolvers).
      network: host
      args:
        GIT_HASH: ${GIT_HASH:-}
    image: v2v_image
    container_name: v2v_server
    restart: always
    ports:
      # Loopback-bound by default: the app is reachable from the host
      # itself (debug) and from sibling containers by service name, but
      # never from the outside network. This keeps the tunnel the sole
      # ingress so trusted-proxy headers stay sound. Set BIND_ADDR=0.0.0.0
      # only for direct (non-tunnel) exposure, behind a CF-whitelisted
      # host firewall.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./.env:/app/.env:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    # Least privilege: drop all capabilities, block privilege
    # escalation, mount the rootfs read-only (the server only writes
    # /app/data and stdout). The entrypoint's root phase needs exactly
    # three back: CHOWN (prepare /app/data) plus SETUID/SETGID for
    # su-exec to drop to app. No `user:` on purpose: the entrypoint
    # adapts /app/data ownership itself, so ops fills in nothing.
    # Rollback if a runtime proves picky: comment out read_only.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
