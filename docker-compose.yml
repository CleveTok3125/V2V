services:
  V2V:
    build:
      context: .
      # Fallback for any layer that still needs egress: the host's network
      # namespace sidesteps container DNS quirks (e.g. link-local resolvers).
      network: host
      args:
        GIT_HASH: ${GIT_HASH:-}
        VERSION: ${GIT_HASH:-}
    # No container_name: run one instance per env with a distinct project
    # name (`docker compose -p v2v-<env>`), so instances never collide.
    image: ${IMAGE_NAME:-v2v_image}
    restart: ${RESTART_POLICY:-always}
    # Mass-impact hardening (container layer): the application cap
    # (MAX_TOTAL_CONNECTIONS) sheds load first; these bounds keep a
    # flood from exhausting host fds, threads, RAM or disk via logs.
    # Derived in the abuse plan: ~90KB/conn steady, ~125MB peak at the
    # 500-conn cap, burst fds ≈ 4x cap.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    pids_limit: 512
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPUS:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    ports:
      # Loopback-bound by default: the app is reachable from the host
      # itself (debug) and from sibling containers by service name, but
      # never from the outside network. This keeps the tunnel the sole
      # ingress so trusted-proxy headers stay sound. Set BIND_ADDR=0.0.0.0
      # only for direct (non-tunnel) exposure, behind a CF-whitelisted
      # host firewall.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-10000}:${PORT:-10000}"
    volumes:
      # One instance dir supplies the whole config tree. ENV_ROOT selects
      # the instance (default instances/default); each env sets its own
      # ENV_ROOT/PORT via --env-file instances/<env>/.env or the shell.
      # Long syntax is deliberate: a bare relative source ("instances/...")
      # is read as a named volume by Compose v2, which breaks the default
      # and any relative ENV_ROOT.
      - type: bind
        source: ${ENV_ROOT:-instances/default}/.env
        target: /app/.env
        read_only: true
      - type: bind
        source: ${ENV_ROOT:-instances/default}/config
        target: /app/config
        read_only: true
      - type: bind
        source: ${ENV_ROOT:-instances/default}/data
        target: /app/data
    # Least privilege: drop all capabilities, block privilege
    # escalation, mount the rootfs read-only (the server only writes
    # /app/data and stdout). The entrypoint's root phase needs exactly
    # three back: CHOWN (prepare /app/data) plus SETUID/SETGID for
    # su-exec to drop to app. No `user:` on purpose: the entrypoint
    # adapts /app/data ownership itself, so ops fills in nothing.
    # Rollback if a runtime proves picky: comment out read_only.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Pin the instance root to the mounted /app tree; the server default
      # (instances/default) is the host-side relative layout.
      - V2V_ROOT=/app
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
      # Mirrors PORT into the image healthcheck, which cannot read the
      # mounted /app/.env.
      - V2V_HEALTH_PORT=${PORT:-10000}
