services:
  V2V:
    build:
      context: .
      # Fallback for any layer that still needs egress: the host's network
      # namespace sidesteps container DNS quirks (e.g. link-local resolvers).
      network: host
      args:
        GIT_HASH: ${GIT_HASH:-}
    image: v2v_image
    container_name: v2v_server
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - TZ=${TIMEZONE:-Asia/Ho_Chi_Minh}
