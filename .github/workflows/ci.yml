name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Entrypoint tests
        # Shell tests for docker/entrypoint.sh (need root for chown;
        # runners have passwordless sudo, local non-root runs skip).
        run: sudo sh docker/entrypoint_test.sh
      - name: WASM build
        # Build only: several server-only dependency trees are not
        # js-compatible, so vet ./... cannot run under GOOS=js.
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./client/
