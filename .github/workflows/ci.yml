name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Race detector
        # Only -race sees a shared-state violation: the concurrency tests in
        # client/ and lib/clientcore cannot see one without it.
        run: make test-race
      - name: Entrypoint tests
        # Same target local check runs (self-skips without root);
        # sudo here for the full matrix on runners.
        run: sudo make test-sh
      - name: WASM compile check
        # Build only, through the stub overlay: Bubble Tea v2 and
        # atotto/clipboard ship no js backend, so a raw GOOS=js build
        # fails. Server trees are not js-compatible either, so vet
        # ./... cannot run under GOOS=js.
        run: make check-wasm
      - name: WASM tests
        # js-tagged client tests (wasm terminal, wasm proxy path)
        # under node, which ubuntu runners provide.
        run: make test-wasm
      - name: TypeScript toolchain
        run: npm install -g typescript
      - name: Web JS up to date
        # The committed webterm/*.js must match the web/ TS sources.
        run: make check-web-ts
      - name: Web cross vectors
        # Go and the vendored JS must agree on argon2id + PoW.
        run: make test-web
